[project]
name = "transcripy"
version = "1.0.0"
description = "Local transcription of voicebot calls and phone recordings into timed speaker turns."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bartosz Niewolski" }]
keywords = [
    "transcription",
    "whisper",
    "faster-whisper",
    "diarization",
    "voicebot",
    "call-center",
    "speech-to-text",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["faster-whisper>=1.2.1,<2"]

[project.optional-dependencies]
diarize = ["pyannote.audio>=3.3"]
server = [
    "fastapi>=0.104,<1",
    "uvicorn[standard]>=0.24,<1",
    "python-multipart>=0.0.6,<1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27,<0.28",
    "fastapi>=0.104,<1",
    "uvicorn[standard]>=0.24,<1",
    "python-multipart>=0.0.6,<1",
]

[project.urls]
Homepage = "https://github.com/niewolski/TranscriPy"
Repository = "https://github.com/niewolski/TranscriPy"
Issues = "https://github.com/niewolski/TranscriPy/issues"
Changelog = "https://github.com/niewolski/TranscriPy/blob/main/CHANGELOG.md"

[project.scripts]
transcripy = "transcripy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transcripy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that need ffmpeg or real audio fixtures",
]
